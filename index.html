<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quantum Periodic Table</title>
<style>
:root{
  --bg:#050914;--panel:#0b1222;--line:#20304d;--text:#eaf3ff;--muted:#8294b3;
  --accent:#35d9ff;--accent2:#8b5cf6;--glow:0 0 24px rgba(53,217,255,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(circle at 20% 10%,rgba(53,217,255,.10),transparent 28%),
  radial-gradient(circle at 80% 80%,rgba(139,92,246,.12),transparent 30%),var(--bg);
  color:var(--text);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh;overflow-x:auto;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:
 linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px}
header{padding:10px 12px 6px;text-align:center;position:relative}
.badge{display:inline-block;padding:6px 12px;border:1px solid #254261;border-radius:999px;color:var(--accent);font-size:11px;letter-spacing:2px;text-transform:uppercase;background:#091326}
h1{margin:5px 0 3px;font-size:clamp(30px,5vw,58px);letter-spacing:-2px;background:linear-gradient(90deg,#fff,var(--accent),#b28cff);-webkit-background-clip:text;color:transparent}
.subtitle{color:var(--muted);margin:0 auto 8px;max-width:800px}
.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
input,select,button{background:#0a1426;color:var(--text);border:1px solid #263b5b;border-radius:10px;padding:11px 14px;outline:none}
input{width:min(320px,80vw)}input:focus,select:focus{border-color:var(--accent);box-shadow:var(--glow)}
button{cursor:pointer}button:hover{border-color:var(--accent);box-shadow:var(--glow)}
main{padding:8px 10px 24px;min-width:0}
.legend{display:flex; margin-bottom:8px;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto 22px;max-width:1250px}
.legend span{font-size:10px;color:#b7c6dc;padding:5px 8px;border:1px solid #243550;border-radius:20px;background:#091224}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.table{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:3px;max-width:none;margin:auto}
.element{
  min-height:0;height:clamp(43px,8.5vh,72px);padding:4px;border:1px solid #253956;border-radius:9px;background:linear-gradient(145deg,#0d182b,#08101e);
  position:relative;cursor:pointer;transition:.22s transform,.22s box-shadow,.22s border-color,.22s opacity;
  overflow:hidden;animation:rise .55s both;
}
.element:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle,var(--c),transparent 58%);opacity:0;transition:.25s}
.element:hover{transform:translateY(-7px) scale(1.06);z-index:5;border-color:var(--c);box-shadow:0 0 20px color-mix(in srgb,var(--c),transparent 55%),inset 0 0 18px color-mix(in srgb,var(--c),transparent 85%))}
.element:hover:before{opacity:.12}
.num{font-size:9px;color:#8295b5;position:relative}.sym{font-size:25px;font-weight:800;color:var(--c);position:relative}.name{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}.mass{font-size:8px;color:#7183a2;position:relative}
.spacer{visibility:hidden}
.section-title{max-width:1450px;margin:24px auto 8px;color:#6f84a6;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.details{
  position:fixed;right:18px;top:18px;width:min(370px,calc(100vw - 36px));background:rgba(8,15,29,.94);
  backdrop-filter:blur(18px);border:1px solid #29415f;border-radius:18px;padding:20px;z-index:20;
  transform:translateX(120%);transition:.35s;box-shadow:0 20px 60px #0008
}
.details.open{transform:translateX(0)}
.close{float:right;font-size:18px;border-radius:50%;padding:4px 9px}
.big{font-size:58px;font-weight:900;color:var(--c);text-shadow:0 0 25px var(--c)}
.dname{font-size:24px;font-weight:700}.symbol-line{color:var(--muted);margin-bottom:16px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{background:#0c172a;border:1px solid #1d2e48;border-radius:9px;padding:10px}.info small{display:block;color:#7184a4;font-size:9px;text-transform:uppercase}.info b{font-size:13px}
#status{text-align:center;color:#657a9c;font-size:11px;margin:12px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(max-height:500px){header{padding:5px 10px 2px} h1{font-size:28px}.subtitle{display:none}.toolbar{gap:5px}.toolbar input,.toolbar select,.toolbar button{padding:6px 9px;font-size:11px}.legend{margin:4px auto}.legend span{padding:3px 5px;font-size:8px}.element{height:clamp(35px,7.2vh,58px);padding:3px}.sym{font-size:18px}.name{font-size:7px}.mass,.num{font-size:7px}.details{width:300px;padding:14px}.big{font-size:42px}}

/* ===== CINEMATIC QUANTUM HUD ===== */
#particleCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.055;
 background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px,transparent 5px)}
.hud-corner{position:fixed;z-index:31;color:#4d789f;font:9px/1.2 ui-monospace,monospace;letter-spacing:2px;opacity:.7}
.hud-corner.tl{top:12px;left:15px}.hud-corner.tr{top:12px;right:15px}
.hud-corner.bl{bottom:12px;left:15px}.hud-corner.br{bottom:12px;right:15px}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#55ffbd;
 box-shadow:0 0 12px #55ffbd;animation:blink 1s infinite}
.energy-ring{position:fixed;pointer-events:none;border:1px solid rgba(53,217,255,.09);
 border-radius:50%;z-index:-1}
.ring-a{width:55vw;height:55vw;left:-28vw;top:18vh;animation:spin 35s linear infinite}
.ring-b{width:45vw;height:45vw;right:-22vw;bottom:-18vw;border-color:rgba(139,92,246,.10);animation:spinReverse 28s linear infinite}
header{position:relative;isolation:isolate}
header:after{content:"";position:absolute;left:50%;top:56%;width:420px;height:130px;transform:translate(-50%,-50%);
 background:radial-gradient(ellipse,rgba(53,217,255,.16),transparent 70%);filter:blur(22px);z-index:-1;pointer-events:none}
h1{position:relative;text-shadow:0 0 28px rgba(53,217,255,.18);animation:titlePulse 4s ease-in-out infinite}
h1:after{content:"";position:absolute;left:5%;right:5%;bottom:-8px;height:1px;
 background:linear-gradient(90deg,transparent,#35d9ff,transparent);animation:scan 3s ease-in-out infinite}
.table{perspective:1400px}
.element{
 transform-style:preserve-3d;
 background:
   linear-gradient(135deg,rgba(255,255,255,.045),transparent 28%),
   linear-gradient(145deg,#0e1a30,#070e1b);
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.018),0 5px 18px rgba(0,0,0,.2);
}
.element:after{content:"";position:absolute;left:-120%;top:0;width:45%;height:100%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);
 transform:skewX(-20deg);animation:shimmer 5s infinite}
.element:hover{
 transform:translateY(-9px) rotateX(5deg) rotateY(-5deg) scale(1.075);
 box-shadow:0 0 8px var(--c),0 0 30px color-mix(in srgb,var(--c),transparent 58%),0 18px 35px #0008,inset 0 0 24px color-mix(in srgb,var(--c),transparent 86%);
}
.element .sym{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c),transparent 35%))}
.element:active{transform:translateY(-3px) scale(.99)}
.element.selected{outline:1px solid var(--c);box-shadow:0 0 10px var(--c),0 0 45px color-mix(in srgb,var(--c),transparent 50%)}
.details{
 background:
 radial-gradient(circle at 90% 5%,rgba(53,217,255,.13),transparent 28%),
 linear-gradient(145deg,rgba(10,20,38,.97),rgba(5,10,20,.97));
 border-color:#315a7d;
}
.details:before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
 background:linear-gradient(115deg,transparent 25%,rgba(53,217,255,.08),transparent 45%);animation:panelSweep 4s infinite}
.big{font-family:ui-monospace,monospace;text-shadow:0 0 25px var(--c),0 0 60px color-mix(in srgb,var(--c),transparent 55%);animation:floatSymbol 3s ease-in-out infinite}
.info{transition:.2s;border-color:#223a58}.info:hover{border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c),transparent 80%)}
.toolbar input,.toolbar select,.toolbar button{backdrop-filter:blur(10px);box-shadow:inset 0 0 18px rgba(53,217,255,.025)}
#status{font-family:ui-monospace,monospace;letter-spacing:2px}
@keyframes blink{50%{opacity:.25;transform:scale(.65)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes titlePulse{50%{filter:brightness(1.18);letter-spacing:-1px}}
@keyframes scan{0%,100%{opacity:.25;transform:scaleX(.4)}50%{opacity:1;transform:scaleX(1)}}
@keyframes shimmer{0%{left:-120%}18%,100%{left:130%}}
@keyframes panelSweep{0%,100%{transform:translateX(-70%)}50%{transform:translateX(70%)}}
@keyframes floatSymbol{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){
 *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}


/* ===== PROFESSIONAL UPGRADE ===== */
.table{min-width:980px}
.element.hidden{display:none}
.element.dim{opacity:.14!important;pointer-events:none}
.toolbar .action-btn.active{border-color:#55ffbd;box-shadow:0 0 18px rgba(85,255,189,.25)}
.details{max-height:calc(100vh - 36px);overflow:auto}
.details::-webkit-scrollbar{width:5px}.details::-webkit-scrollbar-thumb{background:#284667;border-radius:10px}
.detail-head{display:flex;align-items:flex-start;gap:14px;padding-right:42px}
.detail-head .big{min-width:92px;text-align:center}
.dmeta{flex:1}.dmeta .dname{line-height:1.05;margin-top:7px}.dmeta .symbol-line{font-size:11px}
.detail-tabs{display:flex;gap:6px;margin:16px 0 10px;position:sticky;top:0;background:rgba(8,15,29,.96);padding:5px 0;z-index:2}
.detail-tabs button{flex:1;padding:8px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1px}
.detail-tabs button.active{border-color:var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c),transparent 78%)}
.detail-section{display:none}.detail-section.active{display:block}
.info-grid.three{grid-template-columns:repeat(3,1fr)}
.info.wide{grid-column:1/-1}.info b{word-break:break-word}
.e-config{font-family:ui-monospace,monospace;font-size:11px;line-height:1.55;color:#d9f5ff}
.shells{display:flex;gap:6px;flex-wrap:wrap}.shell{min-width:35px;text-align:center;padding:7px 6px;border-radius:9px;background:#081426;border:1px solid #203852}.shell small{display:block;color:#7085a5;font-size:8px}.shell b{font-size:13px;color:var(--c)}
.quick-actions{display:flex;gap:7px;margin-top:12px}.quick-actions button{flex:1;font-size:10px;padding:8px}
.star{color:#8294b3}.star.active{color:#ffd166;text-shadow:0 0 12px #ffd166}
.fav-count{color:#8294b3;font-size:10px;margin-left:4px}
.empty-state{grid-column:1/-1;text-align:center;padding:28px;color:#7184a4;border:1px dashed #27405d;border-radius:12px;background:#091224}
@media(max-height:500px){.details{max-height:calc(100vh - 16px);top:8px;right:8px}.detail-tabs{margin:8px 0}.info-grid.three{grid-template-columns:1fr 1fr}}


/* ===== MOBILE-FIRST RESPONSIVE LAYER ===== */
html{background:var(--bg);scroll-behavior:smooth}
body{overflow-x:hidden;-webkit-text-size-adjust:100%;touch-action:pan-y}
button,input,select{font:inherit;min-height:44px}
.table-scroll{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:5px 2px 12px;border:1px solid rgba(49,90,125,.28);border-radius:14px;background:rgba(5,12,24,.42);scrollbar-width:thin}
.table-scroll::-webkit-scrollbar{height:7px}.table-scroll::-webkit-scrollbar-thumb{background:#315a7d;border-radius:10px}.table-scroll::-webkit-scrollbar-track{background:#0a1426}
.table-scroll .table{width:980px;min-width:980px}
.mobile-hint{display:none}
@media(max-width:700px){
  body{min-height:100svh;padding-bottom:env(safe-area-inset-bottom)}
  .hud-corner{font-size:7px;letter-spacing:1px}.hud-corner.bl,.hud-corner.br{display:none}
  .energy-ring{opacity:.45}.scanlines{opacity:.025}
  header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;position:sticky;top:0;z-index:15;background:linear-gradient(180deg,rgba(5,9,20,.98),rgba(5,9,20,.90) 82%,transparent)}
  header:after{width:280px;height:90px;top:45%}
  .badge{font-size:8px;padding:5px 9px;letter-spacing:1.2px}
  h1{font-size:clamp(27px,9vw,38px);letter-spacing:-1.5px;margin:5px 0}
  .subtitle{font-size:11px;line-height:1.35;margin-bottom:9px;max-width:340px}
  .toolbar{display:grid;grid-template-columns:1fr auto;gap:7px;max-width:520px;margin:auto}
  .toolbar input{grid-column:1/-1;width:100%;min-width:0;font-size:14px;padding:11px 12px}
  .toolbar select,.toolbar button{width:100%;min-width:0;font-size:12px;padding:10px 8px}
  .toolbar button{white-space:nowrap}
  main{padding:4px 9px 28px;overflow:hidden}
  .legend{justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:7px 0 9px;padding:2px 1px 5px;gap:5px}
  .legend span{flex:0 0 auto;font-size:9px;padding:6px 8px}
  #status{font-size:9px;margin:7px 0 8px;letter-spacing:1px}
  .mobile-hint{display:block;text-align:center;color:#6f84a6;font-size:9px;letter-spacing:.5px;margin:0 0 7px}
  .table-scroll{border-radius:12px}
  .table-scroll .table{grid-template-columns:repeat(18,52px);gap:4px}
  .element{height:64px;min-height:64px;padding:5px;border-radius:9px;touch-action:manipulation}
  .element:hover{transform:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.018),0 5px 18px rgba(0,0,0,.2)}
  .element:active{transform:scale(.96);z-index:5}
  .num{font-size:9px}.sym{font-size:23px}.name{font-size:8px}.mass{font-size:7px}
  .section-title{margin:16px 2px 7px;font-size:9px}
  .details{left:0;right:0;bottom:0;top:auto;width:100%;max-width:none;max-height:min(78svh,620px);border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0;padding:16px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);box-shadow:0 -18px 55px #000b}
  .details.open{transform:translateY(0)}
  .details:after{content:"";position:absolute;top:7px;left:50%;width:42px;height:4px;border-radius:99px;background:#35516e;transform:translateX(-50%)}
  .close{position:absolute;right:12px;top:13px;z-index:4;min-height:42px;min-width:42px}
  .detail-head{gap:10px;padding:12px 46px 4px 0}.detail-head .big{min-width:72px;font-size:48px}.dmeta .dname{font-size:20px}.dmeta .symbol-line{font-size:10px;margin-bottom:4px}
  .detail-tabs{margin:9px 0 9px;top:0}.detail-tabs button{min-height:40px;font-size:9px;padding:7px 4px}
  .info-grid{gap:6px}.info{padding:9px}.info small{font-size:8px}.info b{font-size:12px}
  .quick-actions{gap:6px}.quick-actions button{min-height:42px}
  .e-config{font-size:10px;line-height:1.45}
  .shell{min-width:32px;padding:6px 5px}.shell b{font-size:12px}
}
@media(max-width:380px){
  .table-scroll .table{grid-template-columns:repeat(18,48px)}.table-scroll .table{width:900px;min-width:900px}
  .element{height:60px;min-height:60px}.sym{font-size:21px}.name{font-size:7px}
  .details{max-height:82svh}.info{padding:8px}
}
@media(min-width:701px) and (max-height:700px){.table-scroll{overflow-x:auto}.table-scroll .table{width:980px}}
@media(orientation:landscape) and (max-height:520px){
  header{padding:5px 10px}.subtitle{display:none}.badge{display:none}h1{font-size:25px}.toolbar{gap:5px}.toolbar input,.toolbar select,.toolbar button{min-height:38px;padding:7px 9px;font-size:11px}
  .element{height:54px}.table-scroll .table{grid-template-columns:repeat(18,54px)}.mobile-hint{display:block}
  .details{max-height:calc(100svh - 10px)}
}
@media(prefers-reduced-motion:reduce){.details,.element{transition:none!important}}

</style>
</head>

const period=n=> n<=2?1:n<=10?2:n<=18?3:n<=36?4:n<=54?5:n<=86?6:7;
const groupMap={
1:[1,3,11,19,37,55,87],2:[4,12,20,38,56,88],13:[5,13,31,49,81,113],14:[6,14,32,50,82,114],

function groupOf(n){for(const [g,arr] of Object.entries(groupMap))if(arr.includes(n))return +g;if(n>=57&&n<=71)return null;if(n>=89&&n<=103)return null; if(n>=21&&n<=30)return n-18;if(n>=39&&n<=48)return n-36;if(n>=72&&n<=80)return n-68;if(n>=104&&n<=112)return n-92;return null}
function blockOf(n){if([1,2,3,4,11,12,19,20,37,38,55,56,87,88].includes(n))return 's';if((n>=57&&n<=71)||(n>=89&&n<=103))return 'f';if((n>=21&&n<=30)||(n>=39&&n<=48)||(n>=72&&n<=80)||(n>=104&&n<=112))return 'd';return 'p'}

const aufbau=[
 ['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]
];
const exceptions={24:'[Ar] 3d5 4s1',29:'[Ar] 3d10 4s1',41:'[Kr] 4d4 5s1',42:'[Kr] 4d5 5s1',44:'[Kr] 4d7 5s1',45:'[Kr] 4d8 5s1',46:'[Kr] 4d10',47:'[Kr] 4d10 5s1',57:'[Xe] 5d1 6s2',58:'[Xe] 4f1 5d1 6s2',64:'[Xe] 4f7 5d1 6s2',78:'[Xe] 4f14 5d9 6s1',79:'[Xe] 4f14 5d10 6s1',89:'[Rn] 6d1 7s2',90:'[Rn] 6d2 7s2',91:'[Rn] 5f2 6d1 7s2',92:'[Rn] 5f3 6d1 7s2',96:'[Rn] 5f7 6d1 7s2',103:'[Rn] 5f14 7s2 7p1'};
const noble={2:'He',10:'Ne',18:'Ar',36:'Kr',54:'Xe',86:'Rn',118:'Og'};
function electronConfig(n){
 if(exceptions[n])return exceptions[n];
 let left=n, parts=[];
 for(const [orb,cap] of aufbau){if(left<=0)break;const take=Math.min(left,cap);parts.push(orb+take);left-=take;}
 return parts.join(' ');
}
function shellDistribution(n){
 const raw=electronConfig(n);
 const coreShells={He:[2],Ne:[2,8],Ar:[2,8,8],Kr:[2,8,18,8],Xe:[2,8,18,18,8],Rn:[2,8,18,32,18,8]};
 const counts=[0,0,0,0,0,0,0];
 const coreMatch=raw.match(/^\[([A-Za-z]+)\]/);
 if(coreMatch && coreShells[coreMatch[1]]) coreShells[coreMatch[1]].forEach((v,i)=>counts[i]=v);
 const cfg=raw.replace(/^\[[A-Za-z]+\]\s*/,'');
 for(const m of cfg.matchAll(/([1-7])[spdf](\d+)/g))counts[+m[1]-1]+=+m[2];
 return counts.slice(0,period(n));
}

 <section class="detail-section" id="tab-properties"><div class="info-grid">${info('Atomic number',n)}${info('Symbol',sym)}${info('Standard atomic weight',mass+' u')}${info('Phase',stateMap[n]||'Solid / predicted')}${info('Electronegativity',enMap[n]||'—')}${info('Common oxidation states',commonOx[n]||'Variable')}</div><div class="info wide"><small>Data note</small><b>Values shown as educational reference data. “—” means a compact value is not included in this offline dataset.</b></div></section>`;

 document.getElementById('copyBtn').onclick=async()=>{const text=`${name} (${sym})\nAtomic number: ${n}\nAtomic mass: ${mass} u\nCategory: ${names[cat]}\nPeriod: ${period(n)}\nGroup: ${group??'f-block'}\nBlock: ${blockOf(n)}\nElectron configuration: ${config}`;try{await navigator.clipboard.writeText(text);document.getElementById('copyBtn').textContent='Copied ✓';setTimeout(()=>{const b=document.getElementById('copyBtn');if(b)b.textContent='Copy data'},1200)}catch{document.getElementById('copyBtn').textContent='Copy unavailable'}};
}

<script>
/* ===== QUANTUM PARTICLE FIELD ===== */
const pc=document.getElementById("particleCanvas"), ctx=pc.getContext("2d");
let W,H,particles=[],mouse={x:-9999,y:-9999};
function resizeCanvas(){
  const d=devicePixelRatio||1; W=innerWidth; H=innerHeight;
  pc.width=W*d; pc.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  const count=innerWidth<=700?Math.min(55,Math.max(24,Math.floor(W*H/18000))):Math.min(150,Math.max(55,Math.floor(W*H/11000)));
  particles=Array.from({length:count},()=>({
    x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.25,
    vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,
    phase:Math.random()*Math.PI*2
  }));
}
addEventListener("resize",resizeCanvas);
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function particleLoop(t){
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;p.phase+=.015;
    if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;if(p.y<-5)p.y=H+5;if(p.y>H+5)p.y=-5;
    const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
    if(d<120){p.x-=dx*.0015;p.y-=dy*.0015}
    const a=.22+.16*Math.sin(p.phase);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(70,210,255,${a})`;ctx.fill();
  }
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
    const a=particles[i],b=particles[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<95){ctx.strokeStyle=`rgba(53,217,255,${.055*(1-d/95)})`;ctx.lineWidth=.5;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  }
  requestAnimationFrame(particleLoop);
}
resizeCanvas();requestAnimationFrame(particleLoop);
